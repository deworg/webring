name: Linting

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  lint:
    name: Lint (${{ matrix.task }})
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        task:
          - css
          - js
          - pkg-json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CSS lint
        if: matrix.task == 'css'
        run: npm run lint:css

      - name: Run JS lint
        if: matrix.task == 'js'
        run: npm run lint:js

      - name: Run package.json lint
        if: matrix.task == 'pkg-json'
        run: npm run lint:pkg-json
